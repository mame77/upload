services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - ./.data/minio:/data

  minio-mc:
    image: minio/mc:latest
    depends_on:
      - minio
    volumes:
      - ./minio/cors.json:/cors.json:ro
    entrypoint: >
      /bin/sh -c "
      for i in 1 2 3 4 5; do
        /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin && break;
        sleep 1;
      done;
      /usr/bin/mc mb -p local/uploads || true;
      /usr/bin/mc cors set local/uploads /cors.json;
      /usr/bin/mc anonymous set download local/uploads;
      echo 'MinIO CORS configured';
      "
