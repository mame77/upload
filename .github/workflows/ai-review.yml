name: review
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: write
  pull-requests: write
jobs:
  my-job:
    name: opencode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: rmacklin/fetch-through-merge-base@v0

      - uses: oven-sh/setup-bun@v2
      - run: bun install -g opencode-ai
      - name: Debug context
        run: |
          echo "event=${{ github.event_name }}"
          echo "fork_pr=${{ github.event.pull_request.head.repo.fork }}"
          echo "base_ref=${{ github.base_ref }}"
          echo "head_ref=${{ github.head_ref }}"
          echo "diff_lines=$(git diff ${{ github.base_ref }} | wc -l)"
      - run: |
          set -euxo pipefail
          git diff ${{ github.base_ref }} | timeout 180s opencode run --agent=review > ai-review.md
          echo "exit=$?"

      - name: Read review output
        id: read-review
        run: |
          if [ -f ai-review.md ]; then
            echo "message<<EOF" >> $GITHUB_OUTPUT
            cat ai-review.md >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: PR comment with file
        uses: mshick/add-pr-comment@v2
        with:
          message: ${{ steps.read-review.outputs.message }}
          refresh-message-position: true
